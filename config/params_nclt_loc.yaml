dynamic:
  # true: dynamically switch block/cube maps based on the current position; false: load and publish the full original prior map at startup
  use_dynamic_map_loading: true

  # dynamic_pcd_loader/config/params.yaml
# Parameters in the node private namespace (~ at startup).
  # input_pcd: "/home/myx/Fighting/0DATASETS/NCLT/20120202/map/block_map/"  # Source PCD path (relative to the package root or absolute).
  resolution: 20.0                                     # Map block size (m).
  output_directory: "/home/myx/Fighting/0DATASETS/NCLT/20120115/map/block_map"   # Output directory for point cloud blocks.
  load_radius: 100                                    # Dynamic loading radius (m).
  map_frame: "odom"                                   # Point cloud coordinate frame.

  build_dynamic_cube_map: false

  save_traj_dir: "/home/myx/project/zyf_learn/BMLL_LOC/traj/"

  dynamic_corner_map_long_topic: "/dynamic_corner_map_long"
  dynamic_surf_map_long_topic:   "/dynamic_surf_map_long"
  dynamic_corner_map_mid_topic:  "/dynamic_corner_map_mid"
  dynamic_surf_map_mid_topic:    "/dynamic_surf_map_mid"
  dymaic_long_map_query_name:    "/dynamic_long_map_query"
  dymaic_mid_map_query_name:     "/dynamic_mid_map_query"
  use_mid_map_to_loc: 3           #Whether to use the mid-term map for localization.
  useRealtimeLocalMap:            true  # full MM-LOC: enable RRM local-map matching
