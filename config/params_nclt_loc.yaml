use_sim_time: true
roll:
  debugMode: true
  localizationMode: true
  mapUpdateEnabled: false

  # saveKeyframeMap: true
  # savePCD: true
  # savePose: true # for path recording purposes /reloc gt, save it to saveMapDirectory
  # saveLog: true
  # only test
  saveKeyframeMap: true
  savePCD: false
  savePose: false # for path recording purposes /reloc gt, save it to saveMapDirectory
  saveLog: false
  # These histories are bounded; record the pose topic externally for full TUM.
  maxTrajectoryHistorySize: 100
  maxMappingTimeHistorySize: 100
  maxSensorQueueSize: 5

  saveMapDirectory:  /home/myx/Fighting/0DATASETS/NCLT/20120115/map/        
  saveKeyframeMapDirectory: /home/myx/Fighting/0DATASETS/NCLT/20120202/map/keyframes/loc 
  loadKeyframeMapDirectory: "/home/myx/Fighting/0DATASETS/NCLT/12-03-17/map/keyframes" 

  saveRawCloud: false
  # # temporary mapping mode disabled
  # startTemporaryMappingInlierRatioThre: 0.0
  # temporary mapping mode 
  startTemporaryMappingInlierRatioThre: 0.15
  exitTemporaryMappingInlierRatioThre: 0.5
  slidingWindowSize: 30
  
  globalMatchingRate: 5
  # Reject unreliable scan-to-map results before they can pollute GlobalOpt/Tgl.
  globalMatchMinInlierRatio2: 0.1
  # Adaptive weighting for long/mid global constraints (default).
  globalConstraintWeightMode: adaptive
  # History coefficient stays at 0.3; no normalization before clipping.
  globalConstraintInlierWeight: 0.6
  globalConstraintStabilityWeight: 0.1
  # Used only when explicitly selecting fixed mode; squared by GlobalOpt.
  globalConstraintFixedPosSigma: 0.45   # meters: (0.1 + 0.8) / 2
  globalConstraintFixedRotSigma: 0.11   # radians: (0.02 + 0.20) / 2

  alti0: 270.0
  lati: 42.293227
  longi0: -83.709657

